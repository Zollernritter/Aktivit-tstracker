<!DOCTYPE html>
<html>
  
    <head>
        
        <meta charset="utf-8" />
            
        <meta name="viewport" content="width=device-width,initial-scale=1" />
            
        <title>Aktivitätstracker</title>
            
        <!-- <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css"> -->
        <!-- <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script> -->

        <link rel="stylesheet" href="./style.css">
        
    </head>
    
    <body>

        <header class="kopfzeile">   

            <div class="nav-buttons">
                <button onclick="window.location.href='auswertung.html'">
                    Zur Auswertung
                </button>

                <div class="user-info">
                    <span class="user-label">Angemeldet als</span>
                    <span id="user-email">Wird geladen ...</span>
                </div>

                <button id="logout-button">
                    Logout
                </button>
            </div>
        </header>
        
        <main class="eingabe-seite">

            <h1>Eingabe</h1>

            <section class="eingabe-karte">
                <h2>Stimmung</h2>

                <p>Hier kannst du deine Stimmung tracken.</p>

                <div class="start-bereich">
                    <p>Abfrage starten:</p>
                    <button id="start_Stimmung">Start</button>
                </div>

                <div id="Progression_Abfrage_Stimmung"></div>
                <div id="Frage_Stimmung"></div>
                <div id="button_container_1_Stimmung"></div>
                <div id="button_container_2_Stimmung"></div>
                <div id="Antworten_Stimmung"></div>

                <button id="clear_Stimmung">Ausgabe clearen</button>
            </section>

            <section class="eingabe-karte">
                <h2>Aktivitäten</h2>

                <p>Hier kannst du deine Aktivitäten tracken.</p>

                <div class="start-bereich">
                    <p>Abfrage starten:</p>
                    <button id="start_Aktivitäten">Start</button>
                </div>

                <div id="Progression_Abfrage_Aktivitäten"></div>
                <div id="Frage_Aktivitäten"></div>
                <div id="button_container_1_Aktivitäten"></div>
                <div id="button_container_2_Aktivitäten"></div>
                <div id="Antworten_Aktivitäten"></div>

                <button id="clear_Aktivitäten">Ausgabe clearen</button>
            </section>

        </main>


        <script type="module" src="./auth.js"></script>
        <script type="module" src="./eingabe.js"></script>
        
    </body>
</html>
