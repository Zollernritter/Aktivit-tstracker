<!DOCTYPE html>
<html>
  
    <head>
        
        <meta charset="utf-8" />
            
        <meta name="viewport" content="width=device-width,initial-scale=1" />
            
        <title>Aktivitätstracker</title>

        <link rel="stylesheet" href="./style.css">
        
    </head>
    
    <body>

        <header class="kopfzeile">  
            <div class="nav-buttons">
                <button onclick="window.location.href='./index.html'">
                    Zur Eingabe
                </button>

                <div class="user-info">
                        <span class="user-label">Angemeldet als</span>
                        <span id="user-email">Wird geladen ...</span>
                </div>

                <button id="logout-button">
                        Logout
                </button>
            </div>
        </header>
        
        <main class="eingabe-seite">

            <h1>Auswertung</h1>

            <p>Hier kannst du deine Gefühle und Aktivitäten auswerten.</p>

            <section class="eingabe-karte">

                <h2>Gefühle Drucken</h2>

                <button id="print_Gefühle">Alle Gefühle drucken</button>

                <div id="output_Gefühle"></div>

                <button id="clear_Gefühle">Ausgabe clearen</button>

            </section>

            <section class="eingabe-karte">

                <h2>Aktivitäten Drucken</h2>

                <button id="print_Aktivitäten">Alle Aktivitäten drucken</button>

                <div id="output_Aktivitäten"></div>

                <button id="clear_Aktivitäten">Ausgabe clearen</button>

            </section>

        </main>



        <script type="module" src="./auth.js"></script>
        <script type="module" src="./auswertung.js"></script>
        
    </body>
</html>
